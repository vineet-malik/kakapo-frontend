<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1440" />
  <title>Kakapo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --card: #141414;
      --border: #262626;
      --border-soft: #1a1a1a;
      --text: #e5e7eb;
      --text-dim: #9ca3af;
      --text-dimmer: #6b7280;
      --accent: #10b981;
      --muted: #64748b;
      --danger: #ef4444;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: 'cv11', 'ss01';
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 40px 80px;
    }

    /* ========== Top bar ========== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px;
    }
    .tab {
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      background: var(--border);
      color: var(--text);
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .btn {
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
    }
    .btn:hover { color: var(--text); border-color: var(--text-dimmer); }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #0a0a0a;
    }
    .btn-primary:hover { filter: brightness(1.05); color: #0a0a0a; }
    .btn-sm { padding: 6px 10px; font-size: 11px; }
    .keys-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .keys-toolbar h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }
    .key-reveal {
      margin-top: 20px;
      padding: 16px 18px;
      border-radius: 8px;
      border: 1px solid rgba(16, 185, 129, 0.35);
      background: rgba(16, 185, 129, 0.08);
      display: none;
    }
    .key-reveal.show { display: block; }
    .key-reveal-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .key-reveal-value {
      font-family: ui-monospace, monospace;
      font-size: 13px;
      word-break: break-all;
      color: var(--text);
      margin-bottom: 12px;
    }
    .keys-msg {
      font-size: 13px;
      color: var(--text-dimmer);
      margin-bottom: 12px;
    }
    .keys-msg.err { color: var(--danger); }
    .brand {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.6s ease-in-out infinite;
    }
    .status.error .status-dot {
      background: var(--danger);
      animation: pulse-error 1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
      50%      { opacity: 0.5; box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
    }
    @keyframes pulse-error {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }

    /* ========== Stat tiles ========== */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .tile {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px 22px;
      min-height: 108px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .tile.hero {
      grid-column: span 1;
      min-height: 160px;
    }
    .tile-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    .tile-value {
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .tile.hero .tile-value {
      font-size: 60px;
      color: var(--accent);
    }
    .tile.spent .tile-value { color: var(--muted); }

    /* ========== Cards / tables (keys tab) ========== */
    .activity-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .activity-head {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
    }
    .activity-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .activity-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--border) var(--border-soft);
    }
    .activity-scroll::-webkit-scrollbar {
      height: 8px;
    }
    .activity-scroll::-webkit-scrollbar-track {
      background: var(--border-soft);
    }
    .activity-scroll::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    .activity-scroll table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .activity-scroll th {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      text-align: left;
      padding: 12px 22px;
      border-bottom: 1px solid var(--border-soft);
      background: transparent;
      white-space: nowrap;
    }
    .activity-scroll td {
      padding: 14px 22px;
      border-bottom: 1px solid var(--border-soft);
      vertical-align: middle;
      color: var(--text);
    }
    .activity-scroll tr:last-child td { border-bottom: none; }
    .activity-scroll td.time { color: var(--text-dimmer); font-variant-numeric: tabular-nums; width: 80px; }
    .activity-scroll td.model { color: var(--text-dim); font-size: 12px; min-width: 140px; max-width: 200px; }

    .empty {
      padding: 32px 22px;
      color: var(--text-dimmer);
      text-align: center;
      font-size: 12px;
    }

  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="topbar-left">
        <div class="brand">Kakapo</div>
        <nav class="tabs" role="tablist" aria-label="Dashboard sections">
          <button type="button" class="tab active" role="tab" aria-selected="true" data-tab="analyse">Analyse</button>
          <button type="button" class="tab" role="tab" aria-selected="false" data-tab="keys">Key management</button>
        </nav>
      </div>
      <div class="topbar-right">
        <div class="status" id="status">
          <span class="status-dot"></span>
          <span id="status-text">LIVE</span>
        </div>
        <button type="button" class="btn btn-sm" id="sign-out">Sign out</button>
      </div>
    </div>

    <section id="panel-analyse" class="tab-panel active" role="tabpanel" aria-hidden="false">
    <div class="stats">
      <div class="tile hero">
        <div class="tile-label">Total saved this month</div>
        <div class="tile-value" id="val-saved">$0.00</div>
      </div>
      <div class="tile spent">
        <div class="tile-label">Total spent this month</div>
        <div class="tile-value" id="val-spent">$0.00</div>
      </div>
      <div class="tile">
        <div class="tile-label">Cache hit rate (MTD)</div>
        <div class="tile-value" id="val-rate">0.0%</div>
      </div>
      <div class="tile">
        <div class="tile-label">Requests this month</div>
        <div class="tile-value" id="val-requests">0</div>
      </div>
    </div>
    </section>

    <section id="panel-keys" class="tab-panel" role="tabpanel" aria-hidden="true">
      <div class="keys-toolbar">
        <h2>API keys</h2>
        <button type="button" class="btn btn-primary btn-sm" id="btn-generate-key">Generate key</button>
      </div>
      <p class="keys-msg" id="keys-msg"></p>
      <div class="activity-card">
        <div class="activity-head"><div class="activity-title">Your keys</div></div>
        <div class="activity-scroll">
          <table>
            <thead>
              <tr>
                <th>Label</th>
                <th>Prefix</th>
                <th>Created</th>
              </tr>
            </thead>
            <tbody id="keys-tbody">
              <tr><td colspan="3" class="empty">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="key-reveal" id="key-reveal">
        <div class="key-reveal-label">Copy this key now</div>
        <div class="key-reveal-value" id="key-reveal-value"></div>
        <button type="button" class="btn btn-primary btn-sm" id="key-reveal-copy">Copy</button>
      </div>
    </section>
  </div>

  <script>
  (function () {
    var TOKEN_KEY = 'kakapo_auth_token';
    if (!localStorage.getItem(TOKEN_KEY)) {
      window.location.replace('login.html?next=dashboard.html');
      return;
    }
    function getAuthHeaders() {
      var t = localStorage.getItem(TOKEN_KEY);
      return t ? { Authorization: 'Bearer ' + t } : {};
    }
    function clearAuthAndRedirect() {
      localStorage.removeItem(TOKEN_KEY);
      window.location.replace('login.html?next=dashboard.html');
    }
    async function authFetch(url, opts) {
      opts = opts || {};
      var headers = Object.assign({}, getAuthHeaders(), opts.headers || {});
      if (opts.body && typeof opts.body === 'string' && !headers['Content-Type']) {
        headers['Content-Type'] = 'application/json';
      }
      if (opts.body instanceof FormData) delete headers['Content-Type'];
      var res = await fetch(url, Object.assign({}, opts, { headers: headers }));
      if (res.status === 401 || res.status === 403) clearAuthAndRedirect();
      return res;
    }

    document.getElementById('sign-out').addEventListener('click', function () {
      localStorage.removeItem(TOKEN_KEY);
      window.location.href = 'login.html';
    });

    var tabBtns = document.querySelectorAll('.tab');
    var panelAnalyse = document.getElementById('panel-analyse');
    var panelKeys = document.getElementById('panel-keys');
    tabBtns.forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-tab');
        tabBtns.forEach(function (b) {
          b.classList.toggle('active', b === btn);
          b.setAttribute('aria-selected', b === btn ? 'true' : 'false');
        });
        panelAnalyse.classList.toggle('active', id === 'analyse');
        panelKeys.classList.toggle('active', id === 'keys');
        panelAnalyse.setAttribute('aria-hidden', id === 'analyse' ? 'false' : 'true');
        panelKeys.setAttribute('aria-hidden', id === 'keys' ? 'false' : 'true');
        if (id === 'keys') loadKeys();
      });
    });

    var keysTbody = document.getElementById('keys-tbody');
    var keysMsg = document.getElementById('keys-msg');
    var keyReveal = document.getElementById('key-reveal');
    var keyRevealValue = document.getElementById('key-reveal-value');

    function setKeysMsg(text, isErr) {
      keysMsg.textContent = text || '';
      keysMsg.classList.toggle('err', !!isErr);
    }

    async function loadKeys() {
      setKeysMsg('');
      keysTbody.innerHTML = '<tr><td colspan="3" class="empty">Loading…</td></tr>';
      try {
        var res = await authFetch(window.KAKAPO_API_BASE + '/api/keys', { method: 'GET', headers: {} });
        if (!res.ok) throw new Error('bad status ' + res.status);
        var data = await res.json();
        var list = Array.isArray(data) ? data : (data.keys || data.items || []);
        if (!list.length) {
          keysTbody.innerHTML = '<tr><td colspan="3" class="empty">No keys yet. Generate one to use the API.</td></tr>';
          return;
        }
        keysTbody.innerHTML = list.map(function (k) {
          var label = (k.label || k.name || '—').replace(/</g, '&lt;');
          var prefix = (k.prefix || k.key_prefix || (k.id ? String(k.id).slice(0, 8) + '…' : '—')).replace(/</g, '&lt;');
          var created = k.created_at ? new Date(k.created_at).toLocaleString() : (k.created || '—');
          return '<tr><td>' + label + '</td><td class="model">' + prefix + '</td><td class="time">' + created + '</td></tr>';
        }).join('');
      } catch (e) {
        keysTbody.innerHTML = '<tr><td colspan="3" class="empty">Could not load keys.</td></tr>';
        setKeysMsg(e.message || 'Failed to load keys', true);
      }
    }

    document.getElementById('btn-generate-key').addEventListener('click', async function () {
      setKeysMsg('');
      keyReveal.classList.remove('show');
      try {
        var res = await authFetch(window.KAKAPO_API_BASE + '/api/keys', {
          method: 'POST',
          headers: {},
          body: JSON.stringify({}),
        });
        var data = await res.json().catch(function () { return {}; });
        if (!res.ok) {
          setKeysMsg(data.detail || data.message || ('Could not create key (' + res.status + ')'), true);
          return;
        }
        var secret = data.key || data.api_key || data.token || data.secret;
        if (secret) {
          keyRevealValue.textContent = secret;
          keyReveal.classList.add('show');
        }
        await loadKeys();
      } catch (e) {
        setKeysMsg(e.message || 'Network error', true);
      }
    });

    document.getElementById('key-reveal-copy').addEventListener('click', function () {
      var t = keyRevealValue.textContent;
      if (!t) return;
      navigator.clipboard.writeText(t).then(function () {
        setKeysMsg('Copied to clipboard.', false);
      }).catch(function () {
        setKeysMsg('Copy failed — select the key and copy manually.', true);
      });
    });

    // =====================================================================
    // MOCK /api/dashboard — set MOCK = true for local UI without backend.
    // =====================================================================
    const MOCK = false;
    const mockState = { total_spent_usd: 0, total_saved_usd: 0, total_requests: 0, cache_hits: 0 };
    function generateMockStats() {
      const newCount = 1 + Math.floor(Math.random() * 2);
      for (let i = 0; i < newCount; i++) {
        const isHit = Math.random() < 0.38;
        const tokens_in = 80 + Math.floor(Math.random() * 1600);
        const tokens_out = 40 + Math.floor(Math.random() * 420);
        const counterfactual = (tokens_in / 1e6) * 2.5 + (tokens_out / 1e6) * 10.0;
        const cost = 0;
        const saved = isHit ? counterfactual : counterfactual - cost;
        mockState.total_requests += 1;
        if (isHit) mockState.cache_hits += 1;
        mockState.total_spent_usd += cost;
        mockState.total_saved_usd += saved;
      }
      return {
        total_spent_usd: mockState.total_spent_usd,
        total_saved_usd: mockState.total_saved_usd,
        cache_hit_rate: mockState.total_requests > 0 ? mockState.cache_hits / mockState.total_requests : 0,
        total_requests: mockState.total_requests,
      };
    }
    if (MOCK) {
      const realFetch = window.fetch.bind(window);
      window.fetch = function (url, ...rest) {
        if (typeof url === 'string' && url.indexOf('/api/dashboard') !== -1) {
          return new Promise((res) =>
            setTimeout(() => res({ ok: true, json: () => Promise.resolve(generateMockStats()) }), 40)
          );
        }
        return realFetch(url, ...rest);
      };
    }

    // =====================================================================
    // Number tween
    // =====================================================================
    class NumberTween {
      constructor(el, formatter) {
        this.el = el;
        this.formatter = formatter;
        this.current = 0;
        this.raf = null;
      }
      set(target, duration = 500) {
        if (Math.abs(this.current - target) < 1e-9) return;
        cancelAnimationFrame(this.raf);
        const from = this.current;
        const start = performance.now();
        const step = (now) => {
          const t = Math.min((now - start) / duration, 1);
          const eased = 1 - Math.pow(1 - t, 3);
          const v = from + (target - from) * eased;
          this.el.textContent = this.formatter(v);
          if (t < 1) this.raf = requestAnimationFrame(step);
          else { this.current = target; this.el.textContent = this.formatter(target); }
        };
        this.raf = requestAnimationFrame(step);
      }
    }

    const fmtMoney = (v) => '$' + v.toFixed(2);
    const fmtPct = (v) => (v * 100).toFixed(1) + '%';
    const fmtInt = (v) => Math.round(v).toLocaleString('en-US');

    const tweens = {
      saved: new NumberTween(document.getElementById('val-saved'), fmtMoney),
      spent: new NumberTween(document.getElementById('val-spent'), fmtMoney),
      rate:  new NumberTween(document.getElementById('val-rate'),  fmtPct),
      reqs:  new NumberTween(document.getElementById('val-requests'), fmtInt),
    };

    // =====================================================================
    // Polling
    // =====================================================================
    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('status-text');

    async function pollOnce() {
      try {
        const res = await authFetch(window.KAKAPO_API_BASE + '/api/dashboard', {
          cache: 'no-store',
          headers: {},
        });
        if (!res.ok) throw new Error('bad status ' + res.status);
        const s = await res.json();
        applyStats(s);
        statusEl.classList.remove('error');
        statusText.textContent = 'LIVE';
      } catch (e) {
        statusEl.classList.add('error');
        statusText.textContent = 'OFFLINE';
      }
    }

    function applyStats(s) {
      tweens.saved.set(s.total_saved_usd || 0);
      tweens.spent.set(s.total_spent_usd || 0);
      tweens.rate.set(s.cache_hit_rate || 0);
      tweens.reqs.set(s.total_requests || 0);
    }

    pollOnce();
    setInterval(pollOnce, 2000);
  })();
  </script>
</body>
</html>
